<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BuildCarbon OS — Construction Lifecycle, SDG &amp; Carbon Credit Platform</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', '-apple-system', 'BlinkMacSystemFont', 'Segoe UI', 'Roboto', 'sans-serif'],
            mono: ['ui-monospace', 'SFMono-Regular', 'Menlo', 'Monaco', 'Consolas', 'monospace'],
          },
          colors: {
            slatex: {
              850: '#161b22',
              900: '#0d1117',
              950: '#090c10',
            }
          }
        }
      }
    };
  </script>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; font-variant-numeric: tabular-nums; background: #f1f5f9; color: #0f172a; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; }
    .tabular { font-variant-numeric: tabular-nums; }
    .locked-hatch {
      background: repeating-linear-gradient(45deg, #f8fafc, #f8fafc 6px, #e2e8f0 6px, #e2e8f0 12px);
    }
    .blueprint-grid {
      background-image: linear-gradient(to right, rgba(148,163,184,0.12) 1px, transparent 1px),
                        linear-gradient(to bottom, rgba(148,163,184,0.12) 1px, transparent 1px);
      background-size: 20px 20px;
    }
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 3px; }
    ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
    @keyframes pulse-skeleton {
      0%, 100% { opacity: 0.45; }
      50% { opacity: 0.9; }
    }
    .skel { animation: pulse-skeleton 1.4s ease-in-out infinite; background: #e2e8f0; border-radius: 4px; }
  </style>
</head>
<body class="h-screen overflow-hidden flex flex-col text-slate-900">

  <!-- TOP PERSISTENT BAR (FRAME 01) -->

    <div class="flex items-center gap-2.5 min-w-0">
      <button id="mobile-menu-btn" onclick="toggleMobileSidebar()" class="lg:hidden p-1.5 rounded hover:bg-slate-800 text-slate-300" title="Toggle Navigation">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"/></svg>
      </button>
      <div class="flex items-center gap-2 cursor-pointer" onclick="navigateTo('03')">
        <div class="w-7 h-7 rounded bg-emerald-500/20 border border-emerald-400/50 flex items-center justify-center text-emerald-300 font-bold mono text-xs">BC</div>
        <div class="leading-tight hidden sm:block">
          <div class="font-semibold text-sm tracking-tight text-white">BuildCarbon <span class="text-emerald-400">OS</span></div>
          <div class="text-[10px] text-slate-400 mono">45 TABLES · 7 PHASES</div>
        </div>
      </div>

      <div class="h-6 w-px bg-slate-700 mx-1 hidden md:block"></div>

      <!-- PROJECT SCOPE SWITCHER -->
      <div class="flex items-center gap-1.5 bg-slate-800 border border-slate-700 rounded px-2 py-1">
        <span class="text-[10px] uppercase tracking-wider text-slate-400 hidden xl:inline">Scope</span>
        <select id="project-switcher" onchange="switchProject(this.value)" class="bg-transparent text-xs font-semibold text-white focus:outline-none cursor-pointer pr-1">
        </select>
      </div>

      <!-- CURRENT PHASE BADGE -->
      <span id="header-phase-badge" class="hidden md:inline-flex items-center px-2 py-0.5 rounded text-[11px] font-medium bg-sky-500/20 text-sky-300 border border-sky-500/30 mono">
        P5 Construction
      </span>
    </div>

    <!-- GLOBAL SEARCH BAR -->
    <div class="flex-1 max-w-md mx-2">
      <button onclick="openSearchModal()" class="w-full flex items-center justify-between bg-slate-800/90 hover:bg-slate-800 border border-slate-700 rounded px-2.5 py-1.5 text-xs text-slate-400 transition">
        <span class="flex items-center gap-2 truncate">
          <svg class="w-3.5 h-3.5 text-slate-400 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/></svg>
          <span class="truncate">Search tables, WBS, serials, RFIs (e.g. "rfi 418", "CC-NBO")...</span>
        </span>
        <kbd class="hidden sm:inline-block px-1.5 py-0.5 text-[10px] mono bg-slate-900 border border-slate-700 rounded text-slate-400">/</kbd>
      </button>
    </div>

    <!-- RIGHT CONTROLS: ROLE, AUDIT MODE, DATA CURRENCY -->
    <div class="flex items-center gap-2 shrink-0">
      <div class="flex items-center gap-1 bg-slate-800 border border-slate-700 rounded px-2 py-1" title="Active Role (Enforces RBAC Permissions)">
        <span class="text-[10px] uppercase text-slate-400 hidden xl:inline">Role</span>
        <select id="role-switcher" onchange="switchRole(this.value)" class="bg-transparent text-xs font-medium text-amber-300 focus:outline-none cursor-pointer">
          <option value="Owner" class="bg-slate-900 text-white">Owner</option>
          <option value="Architect" class="bg-slate-900 text-white">Architect</option>
          <option value="GC Project Manager" selected class="bg-slate-900 text-white">GC Project Manager</option>
          <option value="Subcontractor" class="bg-slate-900 text-white">Subcontractor</option>
          <option value="Verifier (VVB)" class="bg-slate-900 text-white">Verifier (VVB)</option>
          <option value="Registry Auditor" class="bg-slate-900 text-white">Registry Auditor</option>
        </select>
      </div>

      <button id="audit-toggle-btn" onclick="toggleAuditMode()" class="px-2 py-1 rounded text-[11px] font-medium border border-slate-700 bg-slate-800 text-slate-300 hover:bg-slate-700 transition flex items-center gap-1" title="Toggle Read-Only Audit Mode">
        <span id="audit-dot" class="w-1.5 h-1.5 rounded-full bg-slate-500"></span>
        <span class="hidden sm:inline">Audit</span>
      </button>

      <div class="hidden xl:flex flex-col items-end leading-none text-[10px] mono text-slate-400 pl-1">
        <span class="text-slate-300">2026-11-20</span>
        <span>AS OF DATE</span>
      </div>
    </div>
  </header>

  <!-- GLOBAL NOTIFICATION / BANNER STRIP -->
  <div id="global-banner-area" class="shrink-0"></div>

  <!-- MAIN WORKSPACE BODY -->
  <div class="flex-1 flex overflow-hidden relative">

    <!-- LEFT NAVIGATION RAIL (7 PHASE GROUPS / 25 FRAMES) -->
    <aside id="left-rail" class="w-64 bg-slate-900 text-slate-300 border-r border-slate-800 flex flex-col shrink-0 overflow-y-auto z-20 fixed lg:static inset-y-14 left-0 transform -translate-x-full lg:translate-x-0 transition-transform duration-200">
      <div class="p-3 border-b border-slate-800 flex items-center justify-between">
        <span class="text-[10px] font-bold uppercase tracking-wider text-slate-400">Lifecycle Phase Rail</span>
        <span class="text-[10px] mono px-1.5 py-0.5 rounded bg-slate-800 text-emerald-400 border border-slate-700">25 Frames</span>
      </div>
      <nav id="phase-nav" class="flex-1 p-2 space-y-3 text-xs"></nav>
      <div class="p-3 border-t border-slate-800 text-[10px] text-slate-400 space-y-1 bg-slate-950/60">

  <!-- GLOBAL SEARCH MODAL -->

      <div class="p-3 border-b border-slate-200 flex items-center gap-2 bg-slate-50">

        <input id="global-search-input" type="text" oninput="runGlobalSearch(this.value)" placeholder="Try 'rfi 418', 'E10', 'AHU-3', 'CC-NBO', 'CO-31', '7.3.1'..." class="flex-1 bg-transparent text-sm focus:outline-none text-slate-900" />

    function canWrite(groupName) {
      if (APP_STATE.auditMode) return false;
      const perm = ROLE_PERMISSIONS[APP_STATE.activeRole]?.[groupName] || '';
      return perm === 'RW';
    }

    function fmtCurrency(val) {
      if (val === null || val === undefined) return '—';
      if (Math.abs(val) >= 1e9) return '$' + (val / 1e9).toFixed(2) + 'bn';
      if (Math.abs(val) >= 1e6) return '$' + (val / 1e6).toFixed(2) + 'm';
      if (Math.abs(val) >= 1e3) return '$' + (val / 1e3).toFixed(1) + 'k';
      return '$' + Number(val).toLocaleString();
    }

    function showToast(msg, type = 'info') {
      const box = document.getElementById('toast-container');
      const colors = {
        info: 'bg-slate-900 text-white border-slate-700',
        success: 'bg-emerald-900 text-emerald-50 border-emerald-600',
        warn: 'bg-amber-900 text-amber-50 border-amber-500',
        error: 'bg-rose-900 text-rose-50 border-rose-500'
      };
      const el = document.createElement('div');
      el.className = `pointer-events-auto px-3.5 py-2.5 rounded-md border shadow-lg text-xs font-medium flex items-center gap-2 transition-all ${colors[type] || colors.info}`;
      el.innerHTML = `<span>${msg}</span>`;
      box.appendChild(el);
      setTimeout(() => { el.style.opacity = '0'; setTimeout(() => el.remove(), 300); }, 3400);
    }

    function runGlobalSearch(raw) {
      const q = (raw || '').trim().toLowerCase();
      const box = document.getElementById('search-results');
      const hits = [];

      // Index records across tables
      DB.rfis.forEach(r => hits.push({ group: 'P5 Construction', table: 'rfi', id: r.rfi_id, label: `${r.rfi_id}: ${r.subject}`, frame: '14' }));
      DB.submittals.forEach(s => hits.push({ group: 'P5 Construction', table: 'submittal', id: s.submittal_id, label: `${s.submittal_id}: ${s.subject}`, frame: '14' }));
      DB.ncrs.forEach(n => hits.push({ group: 'P5 Construction', table: 'ncr', id: n.ncr_id, label: `${n.ncr_id}: ${n.description}`, frame: '15' }));
      DB.wbs.forEach(w => hits.push({ group: 'Core spine', table: 'wbs', id: w.wbs_code, label: `WBS ${w.wbs_code} — ${w.description}`, frame: '04' }));
      DB.bim_elements.forEach(e => hits.push({ group: 'D12 Design & Funding', table: 'bim_element', id: e.element_id, label: `${e.element_id} (${e.name}) · IFC ${e.ifc_guid}`, frame: '07' }));
      DB.assets.forEach(a => hits.push({ group: 'P67 Handover & Operations', table: 'asset', id: a.asset_tag_qr, label: `${a.name} · QR ${a.asset_tag_qr} · SN ${a.serial_number}`, frame: '18' }));
      DB.change_orders.forEach(c => hits.push({ group: 'P5 Construction', table: 'change_order', id: c.change_order_id, label: `${c.change_order_id}: ${c.description} (${fmtCurrency(c.approved_variation_value)})`, frame: '17' }));
      DB.project_sdg_targets.forEach(t => hits.push({ group: 'SDG layer', table: 'project_sdg_target', id: t.indicator_code, label: `SDG ${t.indicator_code} (${t.compliance_status}) — Actual ${t.actual_value} vs Target ${t.target_value}`, frame: '21' }));
      DB.carbon_issuances.forEach(i => hits.push({ group: 'Carbon credit layer', table: 'carbon_credit_issuance', id: i.serial_number_range, label: `${i.issuance_id} · ${i.serial_number_range} (${i.tco2e_verified.toLocaleString()} tCO₂e)`, frame: '22' }));
      SCHEMA_TABLES.forEach(t => hits.push({ group: t.group, table: 'SCHEMA', id: t.name, label: `Table: ${t.name} (${t.cols.length} columns) → ERD Inspector`, frame: '23', extra: { table: t.name } }));

      const filtered = q ? hits.filter(h => (h.id + ' ' + h.label + ' ' + h.table).toLowerCase().includes(q)) : hits.slice(0, 10);

      if (!filtered.length) {
        box.innerHTML = `<div class="p-6 text-center text-xs text-slate-500">No matching records across 45 tables for "<strong>${raw}</strong>".</div>`;
        return;
      }

      box.innerHTML = filtered.slice(0, 14).map(h => `
        <button onclick="closeSearchModal(); navigateTo('${h.frame}', ${JSON.stringify(h.extra || {}).replace(/"/g, '&quot;')})" class="w-full text-left px-3.5 py-2.5 hover:bg-sky-50 flex items-center justify-between gap-3 transition">
          <div class="min-w-0">
            <div class="flex items-center gap-2">
              <span class="mono text-[10px] px-1.5 py-0.5 rounded bg-slate-100 border border-slate-300 text-slate-700">${h.table}</span>
              <span class="text-xs font-medium text-slate-900 truncate">${h.label}</span>
            </div>
            <div class="text-[10px] text-slate-500 mt-0.5">${h.group}</div>
          </div>
          <span class="mono text-[11px] text-sky-700 shrink-0 font-semibold">Frame ${h.frame} →</span>
        </button>
      `).join('');
    }

    function submitNewProject(e) {
      e.preventDefault();
      const id = document.getElementById('np-id').value.trim().toUpperCase();
      const name = document.getElementById('np-name').value.trim();
      const rom = Number(document.getElementById('np-rom').value);
      const app = Number(document.getElementById('np-app').value);
      const gfa = Number(document.getElementById('np-gfa').value);
      const end = document.getElementById('np-end').value;
      const err = document.getElementById('np-error');

      if (app > rom * 1.15) {
        err.textContent = `Validation Blocked: Approved budget (${fmtCurrency(app)}) exceeds ROM budget (${fmtCurrency(rom)}) by more than 15% (${fmtCurrency(rom * 1.15)} max without CO).`;
        err.classList.remove('hidden');
        return;
      }
      DB.projects.push({
        project_id: id, name, rom_budget: rom, approved_budget: app, gfa_sqm: gfa,
        target_start_date: '2026-12-01', target_end_date: end, current_phase: 'D12 Design & Funding',
        certificate_of_occupancy_date: null, spi: 1.0, cpi: 1.0, float_days: 0
      });
      closeModal();
      initChrome();
      showToast(`Project ${id} created and added to scope switcher`, 'success');
    }

    function saveWbsNode(wbsId) {
      const node = DB.wbs.find(w => w.wbs_id === wbsId);
      const newCode = document.getElementById('edit-wbs-code').value.trim();
      const newDesc = document.getElementById('edit-wbs-desc').value.trim();
      const newParent = document.getElementById('edit-wbs-parent').value || null;

      // Cycle detection check
      let cursor = newParent;
      while (cursor) {
        if (cursor === wbsId) {
          showToast('Cycle Rejected: A WBS node cannot be a descendant of itself!', 'error');
          return;
        }
        const parentObj = DB.wbs.find(w => w.wbs_id === cursor);
        cursor = parentObj ? parentObj.parent_wbs_id : null;
      }

      node.wbs_code = newCode;
      node.description = newDesc;
      node.parent_wbs_id = newParent;
      showToast(`WBS ${newCode} updated successfully`, 'success');
      renderCurrentFrame();
    }

    function toggleStakeholderStatus(id) {
      if (!canWrite('Core spine')) { showToast('Read-only role cannot modify stakeholder register', 'error'); return; }
      const s = DB.stakeholders.find(x => x.stakeholder_id === id);
      const openRfis = DB.rfis.filter(r => r.stakeholder_id === id && !r.closed_at).length;
      const openSubs = DB.submittals.filter(sub => sub.stakeholder_id === id && !sub.closed_at).length;
      if (s.status === 'active' && (openRfis > 0 || openSubs > 0)) {
        showToast(`Blocked: ${s.organization_name} has ${openRfis} open RFI(s) and ${openSubs} open Submittal(s). Reassign first!`, 'error');
        return;
      }
      s.status = s.status === 'active' ? 'inactive' : 'active';
      showToast(`${s.organization_name} set to ${s.status}`, 'success');
      renderCurrentFrame();
    }

      e.preventDefault();
      const pred = document.getElementById('dep-pred').value;

      if (pred === succ) {
        showToast('Graph Cycle Rejected: Predecessor and successor cannot be identical!', 'error');

      DB.activity_dependencies.push({ dependency_id: `DEP-0${DB.activity_dependencies.length + 1}`, predecessor_id: pred, successor_id: succ, dependency_type: type, lag_days: 0 });

                const bg = score >= 15 ? 'bg-rose-200 border-rose-400 text-rose-950' : score >= 8 ? 'bg-amber-200 border-amber-400 text-amber-950' : 'bg-emerald-100 border-emerald-300 text-emerald-950';

    function awardBidPackage(e) {
      e.preventDefault();
      const pkgId = document.getElementById('aw-pkg').value;
      const pkg = DB.bid_packages.find(p => p.bid_package_id === pkgId);
      if (!pkg) return;
      const just = document.getElementById('aw-just').value.trim();
      if (Math.abs(pkg.bid_variance_pct) > 10 && !just) {
        showToast(`Validation Blocked: ${pkgId} variance (${pkg.bid_variance_pct}%) exceeds ±10% — enter justification!`, 'error');
        return;
      }
      pkg.status = 'awarded';
      DB.contracts.push({
        contract_id: `CON-${pkgId.split('-')[1]}`,
        project_id: APP_STATE.activeProjectId,
        bid_package_id: pkgId,
        stakeholder_id: document.getElementById('aw-sh').value,
        award_value: Number(document.getElementById('aw-val').value),
        retention_pct: Number(document.getElementById('aw-ret').value),
        bond_number: `PB-NBO-${pkgId.split('-')[1]}-X`,
        insurance_expiry: '2027-11-30',
        status: 'issued to site'
      });
      showToast(`Awarded ${pkgId} and created contract CON-${pkgId.split('-')[1]}`, 'success');
      renderCurrentFrame();
    }

    function renewContractInsurance(conId) {
      const c = DB.contracts.find(x => x.contract_id === conId);

      showToast(`Insurance renewed for ${conId} — Frame 17 Payment Application unlocked!`, 'success');
      renderCurrentFrame();

    function submitDailyProgress(e) {
      e.preventDefault();
      const actId = document.getElementById('dp-act').value;
      const hc = Number(document.getElementById('dp-hc').value);
      const mh = Number(document.getElementById('dp-mh').value);
      const pct = Number(document.getElementById('dp-pct').value);
      const ev = Number(document.getElementById('dp-ev').value);
      const ac = Number(document.getElementById('dp-ac').value);

      const prior = DB.daily_progress.filter(d => d.activity_id === actId).sort((a,b) => b.percent_complete - a.percent_complete)[0];
      if (prior && pct < prior.percent_complete) {
        showToast(`Validation Blocked: percent_complete (${pct}%) cannot regress below prior log (${prior.percent_complete}%) without amendment code!`, 'error');
        return;
      }
      if (mh > hc * 20) {
        showToast(`Data-Quality Warning: ${mh} man-hours exceeds 2× standard shift for ${hc} crew — flagged for PM review`, 'warn');
      } else {
        showToast(`Daily progress posted for ${actId} (${pct}%) — S-Curve & CPI updated`, 'success');
      }
      DB.daily_progress.unshift({
        progress_id: `DP-${800 + DB.daily_progress.length + 1}`,
        project_id: APP_STATE.activeProjectId,
        activity_id: actId, boq_id: 'BOQ-101', log_date: '2026-11-20',
        headcount: hc, man_hours: mh, equipment_hours: Math.round(mh * 0.22),
        percent_complete: pct, earned_value_ev: ev, actual_cost_ac: ac
      });
      renderCurrentFrame();
    }

    // --- FRAME 14: RFI & SUBMITTAL WORKFLOW ---
    function renderFrame14() {

                      <div class="flex items-center justify-between">
                        <span class="mono font-bold text-sky-800">${c.id}</span>

    function advanceKanban(kind, id) {
      const order = ['draft', 'awaiting response', 'answered', 'closed'];
      const list = kind === 'RFI' ? DB.rfis : DB.submittals;
      const item = list.find(x => (x.rfi_id || x.submittal_id) === id);
      const nextIdx = Math.min(order.indexOf(item.status) + 1, order.length - 1);
      item.status = order[nextIdx];
      if (item.status === 'closed') item.closed_at = '2026-11-20';
      showToast(`${id} moved to "${item.status}"`, 'success');
      renderCurrentFrame();
    }

    function toggleRfiImpact(kind, id) {
      const list = kind === 'RFI' ? DB.rfis : DB.submittals;
      const item = list.find(x => (x.rfi_id || x.submittal_id) === id);
      item.cost_schedule_impact_flag = !item.cost_schedule_impact_flag;
      if (item.cost_schedule_impact_flag) {
        const coId = `CO-${30 + DB.change_orders.length + 1}`;
        DB.change_orders.push({
          change_order_id: coId, project_id: APP_STATE.activeProjectId, contract_id: 'CON-07', wbs_id: 'WBS-G',
          approved_variation_value: 185000, description: `Auto-spawned from ${id}: ${item.subject}`, stage: 1, source: id

        showToast(`Impact Flag set on ${id} → Spawned candidate ${coId} in Frame 17!`, 'warn');
      } else {
        showToast(`Cleared impact flag on ${id}`, 'info');
      }
      renderCurrentFrame();
    }

    function logFailedTestDemo() {
      const tid = `QT-${1110 + DB.quality_tests.length + 1}`;
      const nid = `NCR-${12 + DB.ncrs.length + 1}`;
      DB.quality_tests.unshift({ test_id: tid, project_id: APP_STATE.activeProjectId, wbs_id: 'WBS-F30', room_id: 'RM-01', element_id: 'EL-214', test_type: 'concrete_cube_fck', target_spec: '>= 50 MPa', measured_value: '41.2 MPa', pass_fail: false });
      DB.ncrs.unshift({ ncr_id: nid, project_id: APP_STATE.activeProjectId, wbs_id: 'WBS-F30', room_id: 'RM-01', element_id: 'EL-214', test_id: tid, description: `Auto-spawned NCR from failed ${tid} (41.2 MPa < 50 MPa)`, ncr_status: 'open', disposition: 'Rework / Core Test Pending', raised_date: '2026-11-20', closed_date: null });
      showToast(`Failed test ${tid} logged → Automatically raised hold-point ${nid}!`, 'error');
      renderCurrentFrame();

    function simulateHighWindLog() {
      DB.weather_logs.unshift({
        weather_id: `WTH-${90 + DB.weather_logs.length + 1}`,
        project_id: APP_STATE.activeProjectId,
        log_date: '2026-11-20', temp_c: 23.5, wind_kmh: 68, rainfall_mm: 2.4, drone_capture_url: null, stand_down: true
      });
      showToast('High wind (68 km/h) logged — Tower crane stand-down triggered & linked to Frame 09 EOT!', 'warn');
      renderCurrentFrame();
    }

    function previewDroneCapture(url) {
      openModal(`
        <div class="p-4 border-b border-slate-200 flex justify-between items-center"><h3 class="font-bold text-sm mono">Orthomosaic Drone Capture · ${url}</h3><button onclick="closeModal()">✕</button></div>
        <div class="p-4 space-y-3 text-xs">
          <div class="h-48 rounded border border-slate-300 blueprint-grid bg-slate-900 text-emerald-400 flex flex-col items-center justify-center p-4 text-center mono">
            <div class="text-sm font-bold">[ GEOTIFF ORTHOMOSAIC PREVIEW · RTK GPS LOCKED ]</div>
            <div class="text-[11px] text-slate-400 mt-1">Elevation: +64.2m · Superstructure Slab L14 Pour Verified · 0 Safety Encroachments</div>
          </div>
          <div class="flex justify-end"><button onclick="closeModal()" class="px-3 py-1.5 bg-slate-900 text-white rounded">Close Preview</button></div>
        </div>
      `);
    }

    // --- FRAME 17: PAYMENTS & CHANGE ORDERS ---
    function renderFrame17() {
      const proj = getActiveProject();
      const apps = DB.payment_applications.filter(p => p.project_id === proj.project_id);
      const cos = DB.change_orders.filter(c => c.project_id === proj.project_id);
      const writable = canWrite('P5 Construction');
      const coStages = ['1. Raised', '2. Priced', '3. PM Approved', '4. Owner Approved'];

      return wrapFrame('17', 'Monthly payment_application certification waterfall (gated by Frame 11 bond/insurance expiry) & 4-stage change_order approvals.', `
        <div class="grid grid-cols-1 lg:grid-cols-2 gap-4">
          <!-- PAYMENT WATERFALL -->
          <div class="border border-slate-200 rounded-md p-3.5">
            <div class="text-xs font-bold uppercase tracking-wider text-slate-500 mb-2">Payment Applications (payment_application)</div>
            <div class="overflow-x-auto">
              <table class="w-full text-xs text-left border-collapse">
                <thead class="bg-slate-100 text-[10px] uppercase text-slate-600 border-b border-slate-200">
                  <tr><th class="p-2">app_id</th><th class="p-2">Contract</th><th class="p-2 text-right">claimed</th><th class="p-2 text-right">certified</th><th class="p-2 text-right">retention</th><th class="p-2">Action / Gate</th></tr>
                </thead>
                <tbody class="divide-y divide-slate-200">
                  ${apps.map(pa => {
                    const contract = DB.contracts.find(c => c.contract_id === pa.contract_id);
                    const insuranceBlocked = contract && contract.insurance_expiry <= '2026-12-20';
                    return `
                      <tr class="${insuranceBlocked ? 'bg-rose-50/70' : ''}">
                        <td class="p-2 mono font-bold">${pa.app_id}</td>
                        <td class="p-2 mono">${pa.contract_id}</td>
                        <td class="p-2 mono text-right">${fmtCurrency(pa.claimed_amount)}</td>
                        <td class="p-2 mono text-right font-semibold">${fmtCurrency(pa.certified_amount)}</td>
                        <td class="p-2 mono text-right text-slate-500">${fmtCurrency(pa.retention_held)}</td>
                        <td class="p-2">
                          ${insuranceBlocked ? `<button onclick="navigateTo('11')" class="text-[10px] font-bold text-rose-700 underline">🛑 Blocked: Renew Ins (F11)</button>` :
                            pa.certified_amount === 0 ? `<button ${!writable ? 'disabled' : ''} onclick="certifyPayment('${pa.app_id}')" class="px-2 py-0.5 rounded bg-emerald-600 text-white text-[10px] font-semibold">Certify PA</button>` :
                            `<span class="text-[10px] text-emerald-700 font-semibold">✓ ${pa.status}</span>`}
                        </td>
                      </tr>
                    `;
                  }).join('')}
                </tbody>
              </table>
            </div>
          </div>

          <!-- CHANGE ORDER STEPPER -->
          <div class="border border-slate-200 rounded-md p-3.5 bg-slate-50 space-y-2.5">
            <div class="text-xs font-bold uppercase tracking-wider text-slate-500">Change Orders (change_order → Forecast Impact)</div>
            ${cos.map(co => `
              <div class="p-3 bg-white rounded border border-slate-200 space-y-2 text-xs">
                <div class="flex items-center justify-between">
                  <span class="mono font-bold text-slate-900">${co.change_order_id} · <span class="text-amber-800">+${fmtCurrency(co.approved_variation_value)}</span></span>
                  <span class="mono text-[10px] text-slate-400">WBS ${co.wbs_id} · ${co.source}</span>
                </div>
                <p class="text-slate-700">${co.description}</p>
                <div class="flex flex-wrap gap-1">
                  ${coStages.map((s, idx) => `<span class="px-2 py-0.5 rounded text-[10px] font-mono ${co.stage === idx + 1 ? 'bg-sky-700 text-white font-bold' : co.stage > idx + 1 ? 'bg-emerald-100 text-emerald-800' : 'bg-slate-100 text-slate-400'}">${s}</span>`).join('')}
                </div>
                ${co.stage < 4 ? `
                  <button ${!writable ? 'disabled' : ''} onclick="advanceChangeOrder('${co.change_order_id}')" class="px-2.5 py-1 rounded text-[11px] font-semibold ${writable ? 'bg-slate-900 text-white hover:bg-slate-800' : 'bg-slate-200 text-slate-400'}">
                    Advance Approval Stage →
                  </button>
                ` : '<span class="text-[11px] text-emerald-700 font-semibold">✓ Committed to Project Forecast</span>'}
              </div>
            `).join('')}
          </div>
        </div>
      `);
    }

    function certifyPayment(appId) {
      const pa = DB.payment_applications.find(x => x.app_id === appId);
      pa.certified_amount = Math.round(pa.claimed_amount * 0.96);
      pa.retention_held = Math.round(pa.certified_amount * 0.10);
      pa.status = 'certified';
      showToast(`Certified ${appId} for ${fmtCurrency(pa.certified_amount)}`, 'success');
      renderCurrentFrame();
    }

    function advanceChangeOrder(coId) {
      const co = DB.change_orders.find(x => x.change_order_id === coId);
      co.stage = Math.min(co.stage + 1, 4);
      showToast(`${coId} moved to stage ${co.stage}/4`, 'success');
      renderCurrentFrame();
    }

    // --- FRAME 18: HANDOVER — ASSETS, COMMISSIONING, PUNCH & STATUTORY ---
    function renderFrame18() {
      const proj = getActiveProject();
      const assets = DB.assets.filter(a => a.project_id === proj.project_id);
      const comms = DB.commissioning_tests.filter(c => c.project_id === proj.project_id);
      const punches = DB.punch_items.filter(p => p.project_id === proj.project_id);
      const insps = DB.municipal_inspections.filter(i => i.project_id === proj.project_id);
      const openPunches = punches.filter(p => !p.resolved_date).length;
      const failedInsps = insps.filter(i => !i.pass_fail).length;
      const failedComms = comms.filter(c => !c.passed_boolean).length;
      const readyForCoo = openPunches === 0 && failedInsps === 0 && failedComms === 0;
      const writable = canWrite('P67 Handover & Operations');

      return wrapFrame('18', 'P67 Gateway: QR asset register, design_target vs measured commissioning_test, punch snags, and statutory Certificate of Occupancy gate.', `
        <div class="grid grid-cols-1 lg:grid-cols-2 gap-4">
          <!-- ASSET REGISTER -->
          <div class="border border-slate-200 rounded-md p-3.5">
            <div class="text-xs font-bold uppercase tracking-wider text-slate-500 mb-2">Commissioned Asset Register (asset)</div>
            <div class="overflow-x-auto">
              <table class="w-full text-xs text-left border-collapse">
                <thead class="bg-slate-100 text-[10px] uppercase text-slate-600 border-b border-slate-200">
                  <tr><th class="p-2">Asset</th><th class="p-2">asset_tag_qr</th><th class="p-2">serial_number</th><th class="p-2">warranty_end</th></tr>
                </thead>
                <tbody class="divide-y divide-slate-200">
                  ${assets.map(a => `
                    <tr>
                      <td class="p-2 font-semibold">${a.name}</td>
                      <td class="p-2 mono text-teal-800 font-bold">${a.asset_tag_qr}</td>
                      <td class="p-2 mono">${a.serial_number}</td>
                      <td class="p-2 mono">${a.warranty_end}</td>
                    </tr>
                  `).join('')}
                </tbody>
              </table>
            </div>
          </div>

          <!-- PUNCH ITEMS -->
          <div class="border border-slate-200 rounded-md p-3.5 bg-slate-50">
            <div class="text-xs font-bold uppercase tracking-wider text-slate-500 mb-2">Room Snag / Punch List (punch_item)</div>
            <div class="space-y-2 text-xs">
              ${punches.map(p => `
                <div class="p-2.5 bg-white rounded border border-slate-200 flex items-center justify-between gap-2">
                  <div>
                    <span class="mono font-bold text-slate-800">${p.punch_id}</span> · <span>${p.description}</span>
                    <div class="text-[10px] mono text-slate-400">Raised ${p.raised_date}</div>
                  </div>
                  ${!p.resolved_date ? `
                    <button ${!writable ? 'disabled' : ''} onclick="resolvePunch('${p.punch_id}')" class="px-2 py-1 rounded bg-sky-600 text-white text-[11px] font-semibold shrink-0">Clear Snag</button>
                  ` : `<span class="mono text-[11px] text-emerald-700 font-bold shrink-0">Resolved ${p.resolved_date}</span>`}
                </div>
              `).join('')}
            </div>
          </div>
        </div>

        <div class="grid grid-cols-1 lg:grid-cols-2 gap-4">
          <!-- COMMISSIONING TESTS -->
          <div class="border border-slate-200 rounded-md p-3.5">
            <div class="text-xs font-bold uppercase tracking-wider text-slate-500 mb-2">Commissioning Readings (commissioning_test)</div>
            <table class="w-full text-xs text-left border-collapse">
              <thead class="bg-slate-100 text-[10px] uppercase text-slate-600 border-b border-slate-200">
                <tr><th class="p-2">Asset</th><th class="p-2">Parameter</th><th class="p-2 text-right">Target</th><th class="p-2 text-right">Measured</th><th class="p-2">Result</th></tr>
              </thead>
              <tbody class="divide-y divide-slate-200">
                ${comms.map(c => `
                  <tr>
                    <td class="p-2 mono font-bold">${c.asset_id}</td>
                    <td class="p-2">${c.test_parameter}</td>
                    <td class="p-2 mono text-right">${c.design_target}</td>
                    <td class="p-2 mono text-right font-bold">${c.measured_reading}</td>
                    <td class="p-2">
                      ${c.passed_boolean ? '<span class="px-2 py-0.5 rounded bg-emerald-100 text-emerald-800 text-[10px] font-bold">☑ PASS</span>' :
                        `<button ${!writable ? 'disabled' : ''} onclick="passCommissioning('${c.comm_id}')" class="px-2 py-0.5 rounded bg-rose-600 text-white text-[10px] font-bold">Fail → Retest Pass</button>`}
                    </td>
                  </tr>
                `).join('')}
              </tbody>
            </table>
          </div>

          <!-- STATUTORY MUNICIPAL GATE -->
          <div class="border border-slate-200 rounded-md p-3.5 bg-slate-50 space-y-2.5">
            <div class="text-xs font-bold uppercase tracking-wider text-slate-500">Statutory Inspections &amp; Certificate of Occupancy Gate</div>
            ${insps.map(i => `
              <div class="p-2 bg-white rounded border border-slate-200 flex items-center justify-between text-xs">
                <span><strong>${i.authority}</strong> <span class="mono text-[10px] text-slate-400">(${i.inspection_date})</span></span>
                ${i.pass_fail ? '<span class="px-2 py-0.5 rounded bg-emerald-100 text-emerald-800 text-[10px] font-bold">PASS</span>' :
                  `<button ${!writable ? 'disabled' : ''} onclick="passInspection('${i.inspection_id}')" class="px-2 py-0.5 rounded bg-amber-600 text-white text-[10px] font-bold">Record Re-Inspection Pass</button>`}
              </div>
            `).join('')}
            <div class="pt-2 border-t border-slate-200 flex items-center justify-between">
              <div class="text-xs">
                <strong>project.certificate_of_occupancy_date:</strong>
                <span class="mono ml-1 font-bold ${proj.certificate_of_occupancy_date ? 'text-emerald-700' : 'text-rose-700'}">${proj.certificate_of_occupancy_date || 'LOCKED (Clear punch, commissioning & inspections)'}</span>
              </div>
              <button ${!readyForCoo || !writable ? 'disabled' : ''} onclick="issueCoo()" class="px-3 py-1.5 rounded text-xs font-bold ${readyForCoo && writable ? 'bg-emerald-600 text-white hover:bg-emerald-700' : 'bg-slate-200 text-slate-400 cursor-not-allowed'}">
                Issue COO
              </button>
            </div>
          </div>
        </div>
      `);
    }

    function resolvePunch(id) {
      DB.punch_items.find(p => p.punch_id === id).resolved_date = '2026-11-20';
      showToast(`Punch item ${id} resolved`, 'success');
      renderCurrentFrame();
    }
    function passCommissioning(id) {
      const c = DB.commissioning_tests.find(x => x.comm_id === id);
      c.measured_reading = c.design_target + 6;
      c.passed_boolean = true;
      showToast(`Commissioning test ${id} passed on retest`, 'success');
      renderCurrentFrame();
    }
    function passInspection(id) {
      DB.municipal_inspections.find(i => i.inspection_id === id).pass_fail = true;
      showToast(`Municipal inspection ${id} passed`, 'success');
      renderCurrentFrame();
    }
    function issueCoo() {
      const proj = getActiveProject();
      proj.certificate_of_occupancy_date = '2026-11-20';
      proj.current_phase = 'P67 Handover & Operations';
      showToast(`Certificate of Occupancy issued for ${proj.name}!`, 'success');
      renderCurrentFrame();
    }

    // --- FRAME 19: DEFECTS LIABILITY & RETENTION RELEASE GATE ---
    function renderFrame19() {
      const proj = getActiveProject();
      const defects = DB.defects.filter(d => d.project_id === proj.project_id);
      const openCount = defects.filter(d => !d.resolved_at).length;
      const retentionApproved = openCount === 0 && defects.every(d => d.retention_release_approved);
      const writable = canWrite('P67 Handover & Operations');

      return wrapFrame('19', 'Defects Liability Period (DLP) SLA tracker enforcing server-side retention_release_approved lock while open defects > 0.', `
        <div class="grid grid-cols-1 lg:grid-cols-3 gap-4">
          <div class="lg:col-span-2 border border-slate-200 rounded-md p-3.5">
            <div class="text-xs font-bold uppercase tracking-wider text-slate-500 mb-2">Defect SLA Tracker (defect)</div>
            <div class="overflow-x-auto">
              <table class="w-full text-xs text-left border-collapse">
                <thead class="bg-slate-100 text-[10px] uppercase text-slate-600 border-b border-slate-200">
                  <tr><th class="p-2">defect_id</th><th class="p-2">Asset / Defect</th><th class="p-2">sla_deadline</th><th class="p-2">resolved_at</th><th class="p-2">Action</th></tr>
                </thead>
                <tbody class="divide-y divide-slate-200">
                  ${defects.map(d => `
                    <tr class="${!d.resolved_at ? 'bg-amber-50/60' : ''}">
                      <td class="p-2 mono font-bold">${d.defect_id}</td>
                      <td class="p-2"><strong>${d.asset_id}</strong>: ${d.description}</td>
                      <td class="p-2 mono text-[11px]">${d.sla_deadline}</td>
                      <td class="p-2 mono text-[11px]">${d.resolved_at || '— OPEN'}</td>
                      <td class="p-2">
                        ${!d.resolved_at ? `
                          <button ${!writable ? 'disabled' : ''} onclick="resolveDefect('${d.defect_id}')" class="px-2 py-0.5 rounded bg-sky-600 text-white text-[10px] font-semibold">Mark Resolved</button>
                        ` : '<span class="text-emerald-700 font-semibold text-[11px]">✓ Verified</span>'}
                      </td>
                    </tr>
                  `).join('')}
                </tbody>
              </table>
            </div>
          </div>

          <!-- RETENTION RELEASE GATE -->
          <div class="border ${openCount > 0 ? 'border-rose-300 bg-rose-50/40' : 'border-emerald-300 bg-emerald-50/40'} rounded-md p-3.5 flex flex-col justify-between space-y-3">
            <div>
              <div class="text-xs font-bold uppercase tracking-wider text-slate-600">Retention Release Server Gate</div>
              <div class="mt-2 grid grid-cols-2 gap-2 text-center">
                <div class="p-2 bg-white rounded border border-slate-200"><div class="text-lg font-bold mono ${openCount > 0 ? 'text-rose-700' : 'text-emerald-700'}">${openCount}</div><div class="text-[10px] uppercase text-slate-500">Open Defects</div></div>
                <div class="p-2 bg-white rounded border border-slate-200"><div class="text-lg font-bold mono">$4.20m</div><div class="text-[10px] uppercase text-slate-500">Retention Pot</div></div>
              </div>
              <div class="mt-3 p-2.5 rounded text-xs font-mono ${openCount > 0 ? 'bg-rose-100 text-rose-900' : retentionApproved ? 'bg-emerald-100 text-emerald-900' : 'bg-amber-100 text-amber-900'}">
                retention_release_approved = <strong>${retentionApproved ? 'TRUE' : 'FALSE'}</strong><br/>
                ${openCount > 0 ? 'STATUS: BLOCKED — Resolve all open DLP defects first.' : retentionApproved ? 'STATUS: RELEASED TO CONTRACTOR' : 'STATUS: ARMED — Ready for Owner Release'}
              </div>
            </div>
            <button ${openCount > 0 || retentionApproved || !writable ? 'disabled' : ''} onclick="approveRetentionRelease()" class="w-full py-2 rounded text-xs font-bold ${openCount === 0 && !retentionApproved && writable ? 'bg-emerald-600 text-white hover:bg-emerald-700' : 'bg-slate-200 text-slate-400 cursor-not-allowed'}">
              Approve Retention Release
            </button>
          </div>
        </div>

        <!-- PREVENTIVE VS REACTIVE -->
        <div class="grid grid-cols-1 lg:grid-cols-2 gap-4">
          <div class="border border-slate-200 rounded-md p-3.5">
            <div class="text-xs font-bold uppercase tracking-wider text-slate-500 mb-2">Preventive Maintenance Plan (maintenance_schedule)</div>
            <table class="w-full text-xs text-left border-collapse">
              <thead class="bg-slate-100 text-[10px] uppercase text-slate-600 border-b border-slate-200">
                <tr><th class="p-2">schedule_id</th><th class="p-2">asset_id</th><th class="p-2">Task</th><th class="p-2">Freq</th><th class="p-2">next_due</th></tr>
              </thead>
              <tbody class="divide-y divide-slate-200">
                ${DB.maintenance_schedules.map(m => `
                  <tr><td class="p-2 mono font-bold">${m.schedule_id}</td><td class="p-2 mono">${m.asset_id}</td><td class="p-2">${m.task_description}</td><td class="p-2 mono">${m.frequency_days}d</td><td class="p-2 mono">${m.next_due_date}</td></tr>
                `).join('')}
              </tbody>
            </table>
          </div>
          <div class="border border-slate-200 rounded-md p-3.5">
            <div class="text-xs font-bold uppercase tracking-wider text-slate-500 mb-2">Reactive Fail Work Orders (work_order)</div>
            <table class="w-full text-xs text-left border-collapse">
              <thead class="bg-slate-100 text-[10px] uppercase text-slate-600 border-b border-slate-200">
                <tr><th class="p-2">work_order_id</th><th class="p-2">asset_id</th><th class="p-2">opened_at</th><th class="p-2 text-right">downtime</th><th class="p-2 text-right">repair_cost</th></tr>
              </thead>
              <tbody class="divide-y divide-slate-200">
                ${DB.work_orders.map(w => `
                  <tr><td class="p-2 mono font-bold">${w.work_order_id}</td><td class="p-2 mono">${w.asset_id}</td><td class="p-2 mono">${w.opened_at}</td><td class="p-2 mono text-right">${w.downtime_hours}h</td><td class="p-2 mono text-right">${fmtCurrency(w.repair_cost)}</td></tr>
                `).join('')}
              </tbody>
            </table>
          </div>

    function executeCarbonTx(e) {
      e.preventDefault();
      const proj = getActiveProject();
      const cp = DB.carbon_projects.find(c => c.project_id === proj.project_id) || DB.carbon_projects[0];
      const issuances = DB.carbon_issuances.filter(i => i.carbon_project_id === cp.carbon_project_id);
      const txs = DB.carbon_transactions.filter(t => issuances.some(i => i.issuance_id === t.issuance_id));
      const totalIssued = issuances.reduce((s, i) => s + i.tco2e_verified, 0);
      const totalOut = txs.filter(t => ['R', 'S', 'T'].includes(t.transaction_type)).reduce((s, t) => s + t.quantity_tco2e, 0);
      const available = totalIssued - totalOut;

      const type = document.getElementById('ctx-type').value;
      const qty = Number(document.getElementById('ctx-qty').value);
      const party = document.getElementById('ctx-party').value.trim();

      if (qty > available) {
        showToast(`Registry Validation Blocked: Requested ${qty.toLocaleString()} tCO₂e exceeds available verified balance (${available.toLocaleString()} tCO₂e)!`, 'error');
        return;
      }
      DB.carbon_transactions.push({
        transaction_id: `TX-0${30 + DB.carbon_transactions.length + 1}`,
        issuance_id: issuances[issuances.length - 1].issuance_id,
        transaction_type: type,
        counterparty: party,
        quantity_tco2e: qty,
        price_per_tco2e: type === 'S' ? 32.50 : null,
        transaction_date: '2026-11-20',
        retirement_beneficiary: type === 'R' ? party : null,
        registry_reference: `RR-${88200 + DB.carbon_transactions.length}`
      });
      showToast(type === 'R' ? `Irreversibly retired ${qty.toLocaleString()} tCO₂e for ${party}!` : `Posted ${type} transaction for ${qty.toLocaleString()} tCO₂e`, 'success');
      renderCurrentFrame();
    }

              ${PHASE_GROUPS.map(g => `
                <optgroup label="${g.name} (${g.tableCount} tables)">
                  ${SCHEMA_TABLES.filter(t => t.group === g.name).map(t => `<option value="${t.name}" ${t.name === tbl.name ? 'selected' : ''}>${t.name} (${t.cols.length} cols)</option>`).join('')}
                </optgroup>
              `).join('')}
            </select>
          </div>
          <button onclick="navigateTo('${tbl.frame}')" class="px-3 py-1.5 rounded bg-sky-600 hover:bg-sky-700 text-white text-xs font-semibold">
            Jump to Owning Screen (Frame ${tbl.frame}) →
          </button>
        </div>

        <div class="grid grid-cols-1 lg:grid-cols-3 gap-4">
          <!-- COLUMNS -->
          <div class="lg:col-span-2 border border-slate-200 rounded-md p-3.5">
            <div class="text-xs font-bold uppercase tracking-wider text-slate-500 mb-2">Columns — ${tbl.name} (${tbl.cols.length})</div>
            <div class="grid grid-cols-1 sm:grid-cols-2 gap-2">
              ${tbl.cols.map(c => `
                <div class="p-2 rounded border flex items-center justify-between text-xs mono ${c.pk ? 'bg-amber-50 border-amber-300' : c.fk ? 'bg-teal-50 border-teal-300' : 'bg-white border-slate-200'}">
                  <div class="flex items-center gap-1.5">
                    ${c.pk ? '<span class="px-1 rounded bg-amber-600 text-white text-[9px] font-bold">PK</span>' : ''}
                    ${c.fk ? '<span class="px-1 rounded bg-teal-700 text-white text-[9px] font-bold">FK</span>' : ''}
                    <span class="font-bold text-slate-900">${c.n}</span>
                  </div>
                  <span class="text-[10px] text-slate-500">${c.t}</span>
                </div>
              `).join('')}
            </div>
          </div>

          <!-- OUTGOING FKS -->
          <div class="border border-slate-200 rounded-md p-3.5 bg-slate-50 space-y-2">
            <div class="text-xs font-bold uppercase tracking-wider text-slate-500">Outgoing FKs (${outgoing.length})</div>
            ${outgoing.length ? outgoing.map(c => `
              <button onclick="APP_STATE.selectedInspectorTable='${c.fk}'; renderCurrentFrame();" class="w-full text-left p-2 rounded bg-white hover:bg-teal-50 border border-teal-300 text-xs mono flex items-center justify-between">
                <span>${c.n} → <strong>${c.fk}</strong></span>
                <span class="text-teal-700">Inspect →</span>
              </button>
            `).join('') : '<p class="text-xs text-slate-500">Root spine table (0 outgoing FKs).</p>'}
          </div>
        </div>

        <!-- INCOMING FKS -->
        <div class="border border-slate-200 rounded-md p-3.5">
          <div class="text-xs font-bold uppercase tracking-wider text-slate-500 mb-2">Incoming References Across All 45 Tables (${incoming.length})</div>
          ${incoming.length ? `
            <div class="flex flex-wrap gap-2">
              ${incoming.map(inc => `
                <button onclick="APP_STATE.selectedInspectorTable='${inc.fromTable}'; renderCurrentFrame();" class="px-2.5 py-1 rounded bg-teal-50 hover:bg-teal-100 border border-teal-300 text-teal-950 mono text-xs">
                  <strong>${inc.fromTable}</strong>.${inc.fromCol} <span class="text-[10px] text-slate-500">(Frame ${inc.frame})</span>
                </button>
              `).join('')}
            </div>
          ` : '<p class="text-xs text-slate-500">Leaf table (no downstream foreign keys reference this table).</p>'}
        </div>
      `);
    }

    // --- FRAME 24: MOBILE FIELD CAPTURE — OFFLINE-FIRST ---
    function renderFrame24() {
      const writable = canWrite('P5 Construction');
      return wrapFrame('24', 'Offline-first tablet/phone field capture simulator queueing daily_progress, quality_test, hse_record, and rfi with explicit conflict resolution.', `
        <div class="flex flex-wrap items-center justify-between gap-2 p-3 rounded-md bg-slate-900 text-white">
          <div class="flex items-center gap-2.5">
            <span class="w-2.5 h-2.5 rounded-full ${APP_STATE.mobileOffline ? 'bg-amber-400' : 'bg-emerald-400'}"></span>
            <span class="text-xs font-bold mono">${APP_STATE.mobileOffline ? 'AIRPLANE / OFFLINE MODE (LOCAL INDEXEDDB QUEUE)' : 'ONLINE · 5G SITE MESH CONNECTED'}</span>
          </div>
          <div class="flex gap-2">
            <button onclick="APP_STATE.mobileOffline = !APP_STATE.mobileOffline; renderCurrentFrame();" class="px-2.5 py-1 rounded bg-slate-800 hover:bg-slate-700 border border-slate-600 text-xs">
              Toggle ${APP_STATE.mobileOffline ? 'Online' : 'Offline'}
            </button>
            <button onclick="syncMobileQueue()" class="px-3 py-1 rounded bg-emerald-600 hover:bg-emerald-500 text-xs font-bold">
              Sync Queue (${APP_STATE.mobileQueue.length})
            </button>
          </div>
        </div>

        <div class="grid grid-cols-1 lg:grid-cols-2 gap-4">
          <!-- MOBILE SIMULATOR FRAME -->
          <div class="max-w-md mx-auto w-full border-4 border-slate-800 rounded-2xl bg-white shadow-lg overflow-hidden">
            <div class="bg-slate-800 text-slate-200 px-4 py-1.5 flex justify-between text-[10px] mono">
              <span>iPad Pro Field · GPS 25.186°N</span>
              <span>Battery 84%</span>
            </div>
            <form onsubmit="enqueueMobileRecord(event)" class="p-4 space-y-3 text-xs">
              <div class="font-bold text-sm text-slate-900">Quick Field Capture Form</div>
              <div>
                <label class="block text-[10px] font-bold uppercase text-slate-500 mb-1">Target Schema Table</label>
                <select id="mob-table" class="w-full border border-slate-300 rounded px-2.5 py-1.5 mono bg-slate-50">
                  <option value="daily_progress">daily_progress (Shift Progress)</option>
                  <option value="quality_test">quality_test (Slump / Cube Reading)</option>
                  <option value="hse_record">hse_record (Toolbox / Observation)</option>
                  <option value="rfi">rfi (Geo-Tagged Site Query)</option>
                </select>
              </div>
              <div>
                <label class="block text-[10px] font-bold uppercase text-slate-500 mb-1">Field Observation / Measurement</label>
                <input id="mob-note" required value="L15 Core Wall Rebar Inspection · 100% compliant" class="w-full border border-slate-300 rounded px-2.5 py-1.5" />
              </div>
              <div class="p-2 rounded bg-slate-100 border border-dashed border-slate-300 text-[11px] mono text-slate-600 flex justify-between">
                <span>📷 IMG_2041.JPG (2.4 MB compressed)</span>
                <span>Geo-stamped ✓</span>
              </div>
              <button ${!writable ? 'disabled' : ''} type="submit" class="w-full py-2 rounded-md font-bold ${writable ? 'bg-sky-600 text-white hover:bg-sky-700' : 'bg-slate-200 text-slate-400'}">
                Save to Local Queue
              </button>
            </form>
          </div>

          <!-- SYNC QUEUE & CONFLICT RESOLVER -->
          <div class="border border-slate-200 rounded-md p-3.5 bg-slate-50 space-y-3">
            <div class="text-xs font-bold uppercase tracking-wider text-slate-500">Local Sync Queue &amp; Conflict Resolution</div>
            <div class="space-y-2 text-xs">
              ${APP_STATE.mobileQueue.map(item => `
                <div class="p-2.5 bg-white rounded border ${item.conflict ? 'border-rose-400' : 'border-slate-200'} space-y-1.5">
                  <div class="flex items-center justify-between">
                    <span class="mono font-bold text-slate-900">${item.id} · ${item.table}</span>
                    <span class="px-2 py-0.5 rounded text-[10px] font-mono ${item.conflict ? 'bg-rose-100 text-rose-800 font-bold' : 'bg-amber-100 text-amber-800'}">${item.status}</span>
                  </div>
                  <div class="text-slate-700">${item.summary}</div>
                  ${item.conflict ? `
                    <div class="p-2 rounded bg-rose-50 border border-rose-200 text-[11px] space-y-1">
                      <div><strong>Merge Conflict:</strong> Local = <code>52.1 MPa</code> vs Desktop Server = <code>51.8 MPa</code></div>
                      <button onclick="resolveMobileConflict('${item.id}')" class="px-2 py-0.5 rounded bg-rose-700 text-white font-semibold">Accept Local &amp; Keep Audit Trail</button>
                    </div>
                  ` : ''}
                </div>
              `).join('') || '<div class="p-4 text-center text-xs text-emerald-700 bg-emerald-50 rounded border border-emerald-200">✓ All field records synchronized with central PostgreSQL cluster.</div>'}
            </div>
          </div>
        </div>
      `);
    }

    function enqueueMobileRecord(e) {
      e.preventDefault();
      const tbl = document.getElementById('mob-table').value;
      const note = document.getElementById('mob-note').value.trim();
      APP_STATE.mobileQueue.unshift({
        id: `MQ-0${APP_STATE.mobileQueue.length + 1}`,
        table: tbl, summary: note, time: '18:47',
        status: APP_STATE.mobileOffline ? 'queued (offline)' : 'ready to sync',
        conflict: false
      });
      showToast(`Captured ${tbl} record into offline device queue`, 'info');
      renderCurrentFrame();
    }

    function resolveMobileConflict(id) {
      const item = APP_STATE.mobileQueue.find(x => x.id === id);
      item.conflict = false;
      item.status = 'merged (audit logged)';
      showToast(`Conflict resolved for ${id} — audit trail preserved`, 'success');
      renderCurrentFrame();
    }

    function syncMobileQueue() {
      if (APP_STATE.mobileOffline) {
        showToast('Device is in Airplane Mode — switch to Online to flush queue!', 'warn');
        return;
      }
      if (APP_STATE.mobileQueue.some(x => x.conflict)) {
        showToast('Resolve conflict item MQ-02 before batch sync!', 'error');
        return;
      }
      const count = APP_STATE.mobileQueue.length;
      APP_STATE.mobileQueue = [];
      showToast(`Synced ${count} queued field records to central database`, 'success');
      renderCurrentFrame();
    }

    // --- FRAME 25: CROSS-CUTTING STATE GALLERY ---
    function renderFrame25() {
      const states = [
        { id: 'loading', label: '1. Skeleton Loading' },
        { id: 'empty', label: '2. Empty State' },
        { id: 'error', label: '3. Feed Error + Retry' },
        { id: 'readonly', label: '4. Role Read-Only Lockdown' },
        { id: 'stale', label: '5. Stale Snapshot (>72h)' }
      ];
      const st = APP_STATE.galleryState;

      let previewHtml = '';
      if (st === 'loading') {
        previewHtml = `
          <div class="space-y-2.5 p-4 border border-slate-200 rounded bg-white">
            <div class="h-4 w-48 skel"></div>
            <div class="grid grid-cols-4 gap-2"><div class="h-8 skel"></div><div class="h-8 skel"></div><div class="h-8 skel"></div><div class="h-8 skel"></div></div>
            <div class="h-24 w-full skel"></div>
          </div>`;
      } else if (st === 'empty') {
        previewHtml = `
          <div class="p-8 border-2 border-dashed border-slate-300 rounded bg-slate-50 text-center space-y-2">
            <div class="text-sm font-bold text-slate-700">No purchase_order records for this package</div>
            <p class="text-xs text-slate-500">Raise your first PO from an awarded line in Frame 11 to initiate shipment tracking.</p>
            <button onclick="navigateTo('11')" class="px-3 py-1.5 rounded bg-slate-900 text-white text-xs font-semibold">Go to Frame 11 Procurement →</button>
          </div>`;
      } else if (st === 'error') {
        previewHtml = `
          <div class="p-4 border border-rose-300 rounded bg-rose-50 flex flex-wrap items-center justify-between gap-3">
            <div>
              <div class="text-xs font-bold text-rose-900">Supply Chain Customs Feed Unreachable (HTTP 504 Timeout after 10s)</div>
              <div class="text-[11px] mono text-rose-700 mt-0.5">Last good snapshot: 2026-11-20 09:41 · Exponential backoff attempt #2</div>
            </div>
            <button onclick="showToast('Retrying customs API with 4s backoff... Reconnected!', 'success')" class="px-3 py-1.5 rounded bg-rose-700 hover:bg-rose-800 text-white text-xs font-bold">Retry Now</button>
          </div>`;
      } else if (st === 'readonly') {
        previewHtml = `
          <div class="p-4 border border-slate-300 rounded bg-white space-y-3">
            <div class="px-3 py-1.5 rounded bg-slate-100 text-xs text-slate-700">🔒 Effective Scope: <strong>Subcontractor View</strong> — Write controls hidden; certified figures locked.</div>
            <div class="grid grid-cols-3 gap-3 text-xs">
              <div class="p-2.5 rounded border border-slate-300 locked-hatch"><div class="text-[10px] uppercase text-slate-500">certified_amount</div><div class="mono font-bold">$6.05m 🔒</div></div>
              <div class="p-2.5 rounded border border-slate-300 locked-hatch"><div class="text-[10px] uppercase text-slate-500">retention_held</div><div class="mono font-bold">$0.61m 🔒</div></div>
              <div class="p-2.5 rounded border border-dashed border-slate-300 text-slate-400 flex items-center justify-center">Owner Countersign Hidden</div>
            </div>
          </div>`;
      } else if (st === 'stale') {
        previewHtml = `
          <div class="p-4 border border-amber-400 rounded bg-amber-50 flex flex-wrap items-center justify-between gap-3">
            <div class="text-xs text-amber-950">
              <strong>⚠ Stale Costing Snapshot (6 days old):</strong> Change Order <code>CO-31 (+$1.90m)</code> was approved since this snapshot was cached.
            </div>
            <div class="flex gap-2">
              <button onclick="showToast('Recomputed costing snapshot with CO-31 included!', 'success')" class="px-3 py-1 rounded bg-amber-700 text-white text-xs font-bold">Refresh Snapshot</button>
            </div>
          </div>`;
      }

      return wrapFrame('25', 'Design-system resilience gallery: interactive preview of all 5 non-ideal states enforced across Frame 12 & Frame 17.', `
        <div class="flex flex-wrap gap-2">
          ${states.map(s => `
            <button onclick="APP_STATE.galleryState='${s.id}'; renderCurrentFrame();" class="px-3 py-1.5 rounded text-xs font-semibold border transition ${st === s.id ? 'bg-slate-900 text-white border-slate-900' : 'bg-white border-slate-300 text-slate-700 hover:bg-slate-50'}">
              ${s.label}
            </button>
          `).join('')}
        </div>
        <div>${previewHtml}</div>
      `);
    }

    // Boot Platform
    window.onload = function () {
      initChrome();
    };
  </script>
</body>
</html>
